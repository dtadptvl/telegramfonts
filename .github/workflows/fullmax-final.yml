name: fullmax-final

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_fullmax:
        description: 'Force FULL-MAX lane (final-release/manual override)'
        type: boolean
        default: true

jobs:
  classify:
    name: Critical-Path Classifier (fail-closed)
    runs-on: ubuntu-latest
    outputs:
      fullmax: ${{ steps.decide.outputs.fullmax }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify changed paths (fail-closed FULL-MAX trigger)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FORCE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'fullmax:force') }}
          FORCE_DISPATCH: ${{ github.event.inputs.force_fullmax }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD || true)"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANGED=""
          elif git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only HEAD^1 HEAD || true)"
          else
            CHANGED=""
          fi
          echo "Changed paths:"
          printf '%s\n' "$CHANGED"
          python scripts/critical_path_classifier.py \
            --event "$EVENT_NAME" \
            --force-label "$FORCE_LABEL" \
            --force-dispatch "$FORCE_DISPATCH" \
            --files "$CHANGED"

  fullmax-final:
    name: FULL-MAX E2E (canonical chain at final HEAD)
    needs: classify
    if: needs.classify.outputs.fullmax == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-lock.txt

      - name: Run canonical FULL-MAX E2E tier (exactly once at final HEAD)
        run: |
          # Issue 88 FULLMAX_LANE_COLD_START correction: the browser-marked
          # Chromium readiness/warmup set runs first so the canonical chain
          # never cold-starts the first in-session Chromium launch.
          pytest agent/tests -m "fullmax_e2e or performance or browser" --strict-markers --durations=25
