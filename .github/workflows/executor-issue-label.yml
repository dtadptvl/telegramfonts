name: Executor issue-label handoff

on:
  issues:
    types: [labeled]

concurrency:
  group: orchestra-executor-global
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  executor:
    if: >-
      github.event.label.name == 'orchestra:execute' &&
      github.event.repository.owner.login == github.repository_owner &&
      contains(fromJSON('["dtadptvl"]'), github.actor)
    name: Executor (Luna)
    runs-on: [self-hosted, windows, x64, orchestra]
    timeout-minutes: 10
    steps:
      - name: Checkout current default main cleanly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          clean: true
          path: executor-workspace
          persist-credentials: false

      - name: Run one bounded Executor event
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRA_STATE_FILE: ${{ runner.tool_cache }}\telegramfonts\orchestra-events.sqlite3
        working-directory: executor-workspace
        run: ./orchestra.cmd execute --github-event $env:GITHUB_EVENT_PATH
