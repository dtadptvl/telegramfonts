name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edge:
    name: Edge Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preflight check
        run: npm run preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

  agent:
    name: Agent Python 3.11 Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-lock.txt

      - name: Run pytest
        run: |
          pytest agent/tests

      - name: Run orchestration protocol tests
        run: |
          python .orchestra/tests/test_runner.py

      - name: Run Executor event handoff tests
        run: |
          python .orchestra/tests/test_executor_handoff.py

      - name: Run benchmark harness check
        run: |
          python agent/src/benchmark.py --samples 2 --quiet
