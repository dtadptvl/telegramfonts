[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegramfonts-agent"
version = "0.1.0"
description = "A23 Private Compute Worker for TelegramFonts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fonttools>=4.50.0",
    "brotli>=1.1.0",
    "pillow>=10.0.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "uharfbuzz>=0.40.0",
    "freetype-py>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
