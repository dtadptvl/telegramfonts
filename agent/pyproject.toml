[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegramfonts-agent"
version = "0.1.0"
description = "A23 Private Compute Worker for TelegramFonts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fonttools>=4.50.0",
    "brotli>=1.1.0",
    "pillow>=10.0.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "uharfbuzz>=0.40.0",
    "freetype-py>=2.3.0",
    "playwright>=1.40.0",
]

[project.scripts]
chromium-readiness = "measurement.chromium_readiness:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Explicit pytest tiers. Quick gate selector:
#   -m "not fullmax_e2e and not performance"
# The fullmax-final CI lane and its selector are RETIRED together with
# the BALANCED_MAX/FULL_MAX profiles (ADR-0001; FAST_30 sole profile).
# The fullmax_e2e marker is retained only so the quick-gate exclusion
# stays fail-closed: anything ever marked fullmax_e2e can never enter
# the quick gate.
markers = [
    "fullmax_e2e: RETIRED lane marker (ADR-0001): heavy end-to-end chains of the retired FULL-MAX lane; no executable test carries it; the quick-gate exclusion remains fail-closed",
    "performance: performance-measurement tests (benchmark harness; excluded from the quick gate)",
    "browser: tests exercising real or fake browser-process boundaries (real launches skip when unavailable)",
    "integration: tests composing multiple subsystems against hermetic fakes (included in the quick gate)",
]
